name: Keep Server Alive

on:
  schedule:
    # Runs every 12 minutes to prevent free tier server sleeping
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: |
          URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "BACKEND_URL secret is not set in GitHub repository settings."
            echo "Please set secrets.BACKEND_URL to your deployed server URL (e.g. https://your-app.onrender.com/test)."
            exit 1
          fi
          echo "Pinging $URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP Status Code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Server is awake and healthy!"
          else
            echo "Ping responded with status $STATUS"
          fi
